name: Davomat public face inference equivalence (not deployed)
on:
  push:
    branches: [audit/backend-memory-2026-10]
    paths:
      - 'scripts/benchmark_face_inference.py'
      - '.github/workflows/benchmark-face-inference.yml'
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build original-compatible candidate
        run: python scripts/build_lazy_face_candidate.py
      - name: Install CPU-only machine learning dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps opencv-python-headless==4.12.0.88
          python -c "import cv2; assert hasattr(cv2, 'CascadeClassifier'); print('PASS: OpenCV face detector available')"
      - name: Run same public photo through original and candidate
        run: python scripts/benchmark_face_inference.py
      - name: Attach safe summary without biometric data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davomat-public-face-equivalence-results
          path: davomat_face_inference_benchmark.json
          if-no-files-found: ignore
          retention-days: 14
