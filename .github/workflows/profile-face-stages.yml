name: Profile Davomat face processing stages (read only)
on:
  push:
    branches: [audit/backend-perf-2026-10-13]
    paths:
      - 'scripts/profile_face_pipeline.py'
      - '.github/workflows/profile-face-stages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        detector: [opencv, retinaface]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build candidate from existing audited ZIP
        run: python scripts/build_lazy_face_candidate.py
      - name: Install pinned CPU-only inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps opencv-python-headless==4.12.0.88
      - name: Measure decode, detection, liveness and embedding
        env:
          FACE_TEST_DETECTOR: ${{ matrix.detector }}
        run: python scripts/profile_face_pipeline.py
      - name: Publish timing-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davomat-face-stages-${{ matrix.detector }}-public-photo
          path: davomat_face_stage_profile.json
          if-no-files-found: ignore
          retention-days: 14
