name: Audit RetinaFace crop reuse (no deployment)
on:
  push:
    branches: [audit/backend-perf-2026-10-13]
    paths:
      - 'scripts/benchmark_retinaface_crop_reuse.py'
      - '.github/workflows/audit-retinaface-crop-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original-compatible lazy candidate
        run: python scripts/build_lazy_face_candidate.py
      - name: Install original CPU-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps opencv-python-headless==4.12.0.88
      - name: Compare baseline embeddings with reusable crops
        run: python scripts/benchmark_retinaface_crop_reuse.py
      - name: Upload aggregate timing and disagreement only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retinaface-crop-reuse-public-samples
          path: davomat_retinaface_crop_reuse.json
          if-no-files-found: ignore
          retention-days: 14
