name: Audit idle AI worker RAM (no deployment)
on:
  push:
    branches: [audit/backend-perf-2026-10-13]
    paths:
      - 'scripts/measure_worker_idle_memory.py'
      - '.github/workflows/audit-idle-worker-ram.yml'
permissions:
  contents: read
jobs:
  idle-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build production-derived isolated worker (no deploy)
        run: python scripts/build_lazy_face_candidate.py
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2 psutil==7.1.1
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps opencv-python-headless==4.12.0.88
      - name: Measure actual child RAM before and after worker retirement
        run: python scripts/measure_worker_idle_memory.py
      - name: Publish no-photo metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davomat-worker-idle-ram-audit
          path: davomat_worker_idle_rss.json
          if-no-files-found: ignore
          retention-days: 14
