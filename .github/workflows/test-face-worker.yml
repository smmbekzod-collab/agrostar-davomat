name: Validate isolated face worker (not deployed)
on:
  push:
    branches: [audit/backend-memory-2026-10]
    paths:
      - 'scripts/face_worker_module.py'
      - 'scripts/build_lazy_face_candidate.py'
      - '.github/workflows/test-face-worker.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build both candidates and validate ZIP contents
        run: python scripts/build_lazy_face_candidate.py
      - name: Install original CPU dependencies
        run: |
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --no-deps opencv-python-headless==4.12.0.88
      - name: Test worker process public-face and idle exit
        shell: bash
        env:
          TF_CPP_MIN_LOG_LEVEL: '3'
          CUDA_VISIBLE_DEVICES: '-1'
          FACE_WORKER_IDLE_SECONDS: '30'
        run: |
          python - <<'PY'
          import os, sys, tempfile, zipfile, pathlib, time, json
          from PIL import Image
          from skimage.data import astronaut
          archive='davomat_v4_2_face_worker_candidate.zip'
          with tempfile.TemporaryDirectory() as root:
              with zipfile.ZipFile(archive) as z:
                  target=next(x for x in z.namelist() if x.endswith('/backend/app/services/face.py'))
                  package=pathlib.Path(root)/'backend'
                  prefix=target.removesuffix('app/services/face.py')
                  for name in z.namelist():
                      if name.startswith(prefix+'app/') and not name.endswith('/'):
                          dest=pathlib.Path(root)/name
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(z.read(name))
                  backend=pathlib.Path(root)/prefix
              script=backend/'worker_smoke.py'
              script.write_text("""def run_smoke():
    from app.services.face import analyze_selfie
              from app.services.face_worker import worker_running
              from PIL import Image
              from skimage.data import astronaut
              import os, io, time
              image=Image.fromarray(astronaut()).convert('RGB').crop((70,0,360,360))
              f=io.BytesIO();image.save(f,format='JPEG',quality=92)
              assert not worker_running()
              import app.services.face as face
              assert 'deepface' not in __import__('sys').modules
              result=analyze_selfie(f.getvalue(),require_liveness=False)
              assert len(result[0])>64
              assert worker_running()
              assert 'deepface' not in __import__('sys').modules
              result2=analyze_selfie(f.getvalue(),require_liveness=False)
              assert len(result2[0])==len(result[0])
              time.sleep(36)
              assert not worker_running()
              print('PASS: separate worker, two actual face requests, parent ML unloaded and worker retired',flush=True)
          
if __name__ == '__main__':
    run_smoke()
""")
              os.environ['PYTHONPATH']=str(backend)
              import subprocess
              p=subprocess.run([sys.executable,str(script)],cwd=backend,env=os.environ,capture_output=True,text=True,timeout=210)
              print(p.stdout[-3000:])
              if p.returncode:
                  print(p.stderr[-3500:])
                  raise SystemExit(p.returncode)
          PY
      - name: Publish tested ZIP (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: davomat-v4-2-face-worker-validated
          path: davomat_v4_2_face_worker_candidate.zip
          retention-days: 14
