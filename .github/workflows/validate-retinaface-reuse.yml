name: Validate RetinaFace worker reuse (no deployment)
on:
  push:
    branches: [audit/backend-perf-2026-10-13]
    paths:
      - 'scripts/build_retinaface_reuse_candidate.py'
      - 'scripts/test_retinaface_reuse_worker.py'
      - '.github/workflows/validate-retinaface-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recreate current isolated worker without production data
        run: python scripts/build_lazy_face_candidate.py
      - name: Produce undeployed face worker optimization
        run: python scripts/build_retinaface_reuse_candidate.py
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1 scikit-image==0.25.2
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps opencv-python-headless==4.12.0.88
      - name: Check RetinaFace results match original strict and normal paths
        run: python scripts/test_retinaface_reuse_worker.py
      - name: Publish private-data-free metrics (no deployment artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retinaface-reuse-technical-equivalence
          path: davomat_retinaface_worker_equivalence.json
          if-no-files-found: ignore
          retention-days: 14
