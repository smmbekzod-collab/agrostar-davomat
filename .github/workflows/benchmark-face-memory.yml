name: Compare Davomat face import RAM (isolated)
on:
  push:
    branches: [audit/backend-memory-2026-10]
    paths:
      - 'scripts/benchmark_face_cold_import.py'
      - 'scripts/build_lazy_face_candidate.py'
      - '.github/workflows/benchmark-face-memory.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate isolated candidate ZIP
        run: python scripts/build_lazy_face_candidate.py
      - name: Install face inference runtime (CPU only)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check --no-cache-dir deepface==0.0.100 tensorflow==2.21.0 tf-keras==2.21.0 numpy==2.1.3 opencv-python-headless==4.12.0.88 Pillow==11.3.0 pydantic-settings==2.10.1
      - name: Compare independent process memory and import timing
        run: python scripts/benchmark_face_cold_import.py
      - name: Upload exact benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davomat-4-2-face-ram-benchmark
          path: davomat_face_memory_benchmark.json
          if-no-files-found: ignore
          retention-days: 14
